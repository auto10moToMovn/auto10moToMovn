name: 문제 알리기
description: 페이지나 자동 바꾸기에서 이상한 점을 알린다
body:
  - type: markdown
    attributes:
      value: |
        **먼저 읽어 주세요.**
        - 운영자는 **개인키 · 복구 문구(니모닉) · 개인키 QR 을 절대 묻지 않습니다.** 이슈 · 댓글 · 쪽지 · 메신저 어디서든 그것을 묻는 사람은 가짜입니다.
        - 여기에 개인키 · 복구 문구 · 종이지갑 사진을 **올리지 마세요.** 이 글은 누구나 봅니다.
        - "고객지원"이라며 다른 사이트나 앱으로 데려가는 링크는 누르지 마세요.
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      description: 무엇을 눌렀고 무엇이 보였는지 적어 주세요. 화면 글을 그대로 옮겨 주면 좋습니다.
    validations:
      required: true
  - type: input
    id: tx
    attributes:
      label: 거래 해시 (있으면)
      description: 0x 로 시작하는 66 글자. 없으면 비워 두세요.
  - type: input
    id: address
    attributes:
      label: 종이지갑 주소 (적고 싶을 때만)
      description: 주소는 체인에서 누구나 보는 값이지만, 여기 적으면 내 GitHub 계정과 그 주소가 이어져 보입니다. 원하지 않으면 비워 두세요.
