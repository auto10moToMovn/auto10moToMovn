# 웹페이지를 GitHub Pages 로 올리는 틀이다. **자동으로 돌지 않는다** — 저장소 주인(운영자)이
# GitHub 의 Actions 탭에서 이 workflow 를 손으로 한 번 눌렀을 때만 돈다(workflow_dispatch).
# 올리기 전에 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 둬야 한다.
#
# 커밋된 web/dist 를 **그대로** 올린다. 다시 만들지 않으므로 올라간 페이지의 sha256 은
# README 의 해시 줄과 같다(사용자가 받은 파일과 견줄 수 있다).
# 저장소 변수 BOX_URL(신청함) · DEFAULT_HARVESTER(새로 켜는 지갑의 기본 누르는 지갑)가 있으면 그 옆에
# config.json 을 써 넣는다 — 그 두 값은 저장소에 없다. 값은 평범한 글자만 받고 JSON 은 jq 로 쓴다(2026-11-20 보안 점검).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 저장소 받기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: config.json 쓰기 (저장소 변수 BOX_URL · DEFAULT_HARVESTER 가 있을 때만)
        env:
          BOX_URL: ${{ vars.BOX_URL }}
          DEFAULT_HARVESTER: ${{ vars.DEFAULT_HARVESTER }}
        # 주소는 https 의 평범한 글자만(따옴표 · 역슬래시 · 빈칸 · 제어 문자 없음) 받고, JSON 은 jq 가 쓴다.
        run: |
          if [ -n "${BOX_URL}" ] && { [ "$(printf '%s' "${BOX_URL}" | wc -l)" -ne 0 ] || ! printf '%s' "${BOX_URL}" | grep -Eqx 'https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?'; }; then
            echo "BOX_URL 은 평범한 글자로 된 https 주소여야 합니다" >&2; exit 1
          fi
          if [ -n "${DEFAULT_HARVESTER}" ] && { [ "$(printf '%s' "${DEFAULT_HARVESTER}" | wc -l)" -ne 0 ] || ! printf '%s' "${DEFAULT_HARVESTER}" | grep -Eqx '0x[0-9a-fA-F]{40}'; }; then
            echo "DEFAULT_HARVESTER 는 0x 로 시작하는 주소 전체여야 합니다" >&2; exit 1
          fi
          if [ -n "${BOX_URL}" ] || [ -n "${DEFAULT_HARVESTER}" ]; then
            jq -n --arg box "${BOX_URL}" --arg harvester "${DEFAULT_HARVESTER}" \
              '{boxUrl: (if $box == "" then null else $box end), defaultHarvester: (if $harvester == "" then null else $harvester end)}' > web/dist/config.json
          fi
      - name: 올릴 묶음 만들기 (web/dist 그대로 · 다시 만들지 않음)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist
      - name: 올리기
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
